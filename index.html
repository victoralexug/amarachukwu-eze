<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amarachukwu Eze | Website Design Options</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="assets/images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #c8261c;
      --ink: #16110f;
      --ink-2: #6b625e;
      --surface: #faf8f6;
      --line: #e3dcd7;
      --font: "Inter", system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }
    body {
      display: grid;
      place-items: center;
      padding: 48px 16px;
      background: var(--surface);
      color: var(--ink);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    main { width: 100%; max-width: 480px; display: grid; gap: 32px; }

    h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
    p { margin-top: 8px; font-size: 0.95rem; line-height: 1.6; color: var(--ink-2); }

    ul { list-style: none; border-top: 1px solid var(--line); }
    li a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
      font-weight: 500;
      transition: color 0.2s;
    }
    li a span { color: var(--ink-2); transition: transform 0.2s, color 0.2s; }
    li a:hover, li a:hover span { color: var(--primary); }
    li a:hover span { transform: translateX(4px); }
    li a:focus-visible { outline: 2px solid var(--primary); outline-offset: 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Amarachukwu Eze</h1>
      <p>The chosen design and its variants. Open one, then use "All designs" at the top to come back.</p>
    </header>

    <ul>
      <li><a href="hero-2-clean.html">Clean <span aria-hidden="true">→</span></a></li>
      <li><a href="hero-2-clean-particles.html">Clean, made of data <span aria-hidden="true">→</span></a></li>
      <li><a href="hero-2-clean-lens.html">Clean, data lens <span aria-hidden="true">→</span></a></li>
      <li><a href="hero-2-clean-stepout.html">Clean, step out of the frame <span aria-hidden="true">→</span></a></li>
    </ul>
  </main>
</body>
</html>
